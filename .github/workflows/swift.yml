name: Swift
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
      - run: swift test --parallel --enable-code-coverage
      - run: swift format lint --strict --recursive Sources Tests
